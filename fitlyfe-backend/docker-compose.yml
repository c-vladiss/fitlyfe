services:
  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/fitlyfe
      - DB_USERNAME=fitlyfe
      - DB_PASSWORD=fitlyfe
      - SUPABASE_URL=${SUPABASE_URL}
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=fitlyfe
      - POSTGRES_USER=fitlyfe
      - POSTGRES_PASSWORD=fitlyfe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
