spring:
  application:
    name: fitlyfe-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: hikariPool
      auto-commit: false
    type: com.zaxxer.hikari.HikariDataSource
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities match
      # it and refuses to start if they drift, instead of silently altering it.
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SHOW_SQL:false}
  flyway:
    enabled: true
  graphql:
    graphiql:
      # Interactive query editor. Off unless explicitly enabled (see .env.example).
      enabled: ${GRAPHIQL_ENABLED:false}
server:
  port: 8081

supabase:
  url: ${SUPABASE_URL}

usda:
  api-key: ${USDA_API_KEY}
  # Minimum local results before falling back to the USDA API for a text search
  search-fallback-threshold: 5