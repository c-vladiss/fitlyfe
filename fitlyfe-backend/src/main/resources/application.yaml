spring:
  application:
    name: fitlyfe-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: hikariPool
      auto-commit: false
    type: com.zaxxer.hikari.HikariDataSource
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    properties:
      hibernate:
        format_sql: true
  graphql:
    graphiql:
      enabled: true
server:
  port: 8081

supabase:
  url: ${SUPABASE_URL}

usda:
  api-key: ${USDA_API_KEY}
  # Minimum local results before falling back to the USDA API for a text search
  search-fallback-threshold: 5