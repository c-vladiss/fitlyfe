name: Backend CI

on:
  push:
    paths:
      - 'fitlyfe-backend/**'
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'fitlyfe-backend/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitlyfe-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 🔍 Always
      - name: Build & Test
        run: ./gradlew check

      # 🏗 Optional non-release build on push to main
      - name: Build dev artifact
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: ./gradlew build

      # 🚀 Release artifact on tag push
      - name: Build release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew build
