name: Frontend CI (Flutter)

on:
  push:
    paths:
      - "fitlyfe_frontend/**"
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "fitlyfe_frontend/**"

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.1"
          channel: stable

      - name: Install dependencies
        working-directory: fitlyfe_frontend
        run: flutter pub get

      # Generate GraphQL types (needed for compilation)
      - name: Generate code
        working-directory: fitlyfe_frontend
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # Analyze - only fail on errors, not warnings/info
      - name: Analyze
        working-directory: fitlyfe_frontend
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Run tests with coverage
      - name: Run tests
        working-directory: fitlyfe_frontend
        run: flutter test --coverage

      # Upload coverage report (optional)
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          file: fitlyfe_frontend/coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

      # Build on push to main (non-tag)
      - name: Build debug APK
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        working-directory: fitlyfe_frontend
        run: flutter build apk --debug

      # Release build ONLY on tag push (v*)
      - name: Build release App Bundle
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: fitlyfe_frontend
        run: flutter build appbundle --release
