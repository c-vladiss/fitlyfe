query SearchFoodCatalog($query: String!, $types: [FoodEntryType!], $limit: Int, $offset: Int) {
  searchFoodCatalog(query: $query, types: $types, limit: $limit, offset: $offset) {
    items {
      id
      name
      brand
      entryType
      barcode
      servingSizeG
      caloriesPer100g
      proteinPer100g
      carbsPer100g
      fatPer100g
    }
    total
    hasMore
  }
}

query FoodEntryById($id: ID!) {
  foodEntryById(id: $id) {
    id
    name
    brand
    entryType
    barcode
    servingSizeG
    caloriesPer100g
    proteinPer100g
    carbsPer100g
    fatPer100g
    fiberPer100g
    sugarPer100g
    saturatedFatPer100g
    micronutrients {
      sodiumMg
      potassiumMg
      calciumMg
      ironMg
      magnesiumMg
      zincMg
      phosphorusMg
      vitaminAMcg
      vitaminCMg
      vitaminDMcg
      vitaminEMg
      vitaminKMcg
      vitaminB6Mg
      vitaminB12Mcg
      folateMcg
      niacinMg
      thiaminMg
      riboflavinMg
      cholesterolMg
    }
  }
}

query FoodEntryByBarcode($barcode: String!) {
  foodEntryByBarcode(barcode: $barcode) {
    id
    name
    brand
    entryType
    barcode
    servingSizeG
    caloriesPer100g
    proteinPer100g
    carbsPer100g
    fatPer100g
  }
}
